name: Scrape tournaments

on:
  schedule:
    # Every 6 hours at :10 past (avoids top-of-hour congestion). We still only
    # advertise "every 12 hours" on the site — running 4×/day lets GitHub's
    # scheduling lag eat into the slack while comfortably beating the promise.
    - cron: '10 */6 * * *'
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      # Python block-buffers stdout when it isn't a TTY, so without this the
      # scrapers' [INFO]/[WARN] lines all flush at the very end of a step and
      # appear *after* anything written to stderr (which is never buffered).
      # That made a step look silent for minutes and then dump everything at
      # once, which is how a run of ConnectTimeout warnings got missed
      # entirely. Unbuffered output keeps the log in real chronological order.
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install chromium --with-deps

      - name: Run chess-results scraper
        id: chess_results
        # A chess-results outage must not abort the job: the FIDE step below
        # is what rebuilds tournaments.json, so stopping here would discard a
        # perfectly good FIDE scrape and — because deploy.yml only builds when
        # this workflow concludes successfully — skip the deploy too. When
        # this step fails it writes nothing, so the FIDE step simply carries
        # the previous run's chess-results entries forward unchanged.
        continue-on-error: true
        run: python scraper/scrape_chess_results.py

      - name: Run FIDE ratings scraper (USA)
        # Must run after the chess-results scraper: this step rewrites
        # tournaments.json by combining its own archive with whatever the
        # chess-results scraper just wrote there, so it always needs to run
        # last to avoid dropping either source's entries.
        #
        # It also decides the job's fate. It tolerates its own source being
        # down, but fails the run if chess-results failed as well, since then
        # no source produced anything new. outcome (not conclusion) is the
        # step's real result before continue-on-error is applied.
        env:
          CHESS_RESULTS_OUTCOME: ${{ steps.chess_results.outcome }}
        run: python scraper/scrape_fide_ratings.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/tournaments.json public/data/archive.json public/data/fide_archive.json public/data/fide_details.json public/data/meta.json
          if git diff --cached --quiet; then
            echo "No changes to tournament data."
          else
            git commit -m "chore: update tournament data"
            git push
          fi
